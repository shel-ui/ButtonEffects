<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styling.css">
    <title>Types of Buttons Animations</title>
</head>
<body>
    <div>
        <h1>Types of button animations</h1>
        <h2>Using transforms</h2>
        <div class="btns-transforms">
            <button class="btn1">color changed</button>
            <button class="btn2">↑ -20Y</button>
            <button class="btn3">↓ -20Y</button>
            <button class="btn4">← -20X</button>
            <button class="btn5">→ -20X</button>
        </div>

        <h2>Using Transitions</h2>
        <i><span style="color: red;">Press</span> and <span style="color: red;">hold</span> to see the effects!</i>
        <div class="btns-transitions">
            <button class="btn6">scale</button>
            <button class="btn7">linear</button>
            <button class="btn8">ease-out</button>
            <button class="btn9">Press me!</button>
            <button class="btn10">Press me!</button>
        </div>
    </div>
</body>
</html>
